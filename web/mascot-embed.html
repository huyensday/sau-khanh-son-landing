<style>
html,body{margin:0;height:100%;background:transparent;color-scheme:dark;overflow:hidden}
three-d-stage:not(:defined){visibility:hidden}
three-d-stage{width:100vw;height:100vh;display:block}
</style>
</head>
<body>
<three-d-stage name="sau-cool-gen-z" background="transparent" autorotate></three-d-stage>
<script src="three-d-stage.js"></script>
<script>
/* strip the export toolbar the moment the shadow root appears — it must never flash in the intro */
const stage = document.querySelector('three-d-stage');
const strip = () => {
  const sr = stage.shadowRoot;
  if (!sr) return false;
  sr.querySelectorAll('.toolbar,.note,button,a[download]').forEach(e => e.remove());
  if (!sr.querySelector('#no-chrome')) {
    const st = document.createElement('style');
    st.id = 'no-chrome';
    st.textContent = '.toolbar,.note,button,a[download]{display:none!important}';
    sr.appendChild(st);
  }
  return true;
};
if (!strip()) {
  const iv = setInterval(() => { if (strip()) clearInterval(iv); }, 30);
  setTimeout(() => clearInterval(iv), 8000);
}
</script>
<script type="module">
import './mascot.js';
const s = document.querySelector('three-d-stage');
if (s._ground) s._ground.visible = false;
</script>
</body>
</html>
